name: Generar APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -XX:MaxMetaspaceSize=1g
        -Dorg.gradle.daemon=false

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !books-zip/*
            /books-zip/ADayInReverse.zip
            !capturas_completas_video_onboarding_config_biblioteca_libro
          sparse-checkout-cone-mode: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Generar proyecto nativo Android
        run: npx expo prebuild --platform android --no-install

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compilar APK release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Preparar APK para descarga
        shell: bash
        run: |
          APK_PATH="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No se encontró el APK release generado por Gradle." >&2
            exit 1
          fi
          cp "$APK_PATH" cuentos-para-dormir.apk
          ls -lh cuentos-para-dormir.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v6
        with:
          name: cuentos-para-dormir-apk
          path: cuentos-para-dormir.apk
          if-no-files-found: error
          retention-days: 30
